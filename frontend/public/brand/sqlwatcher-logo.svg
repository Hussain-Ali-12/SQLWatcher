<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="SQLWatcher logo">
  <title>SQLWatcher Primary Logo</title>
  <desc>Primary logo with navy database icon, cyan blue eye, and SQLWatcher wordmark.</desc>
  
  
    <g transform="translate(42,55) scale(0.95)">
      <defs>
        <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#00296F"/>
          <stop offset="1" stop-color="#001F5B"/>
        </linearGradient>
        <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#00D5FF"/>
          <stop offset="1" stop-color="#00B8E6"/>
        </linearGradient>
      </defs>

      <!-- database body -->
      <path d="M42 58 C42 31 238 31 238 58 L238 194 C238 223 42 223 42 194 Z" fill="url(#dbGrad)"/>
      <ellipse cx="140" cy="58" rx="98" ry="27" fill="#00245F"/>

      <!-- white database separators -->
      <path d="M42 102 C68 126 212 126 238 102" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>
      <path d="M42 156 C68 181 212 181 238 156" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>

      <!-- clean eye cutout -->
      <path d="M70 130 C102 96 178 96 210 130 C178 164 102 164 70 130 Z" fill="white"/>
      <circle cx="140" cy="130" r="34" fill="url(#cyanGrad)"/>
      <circle cx="140" cy="130" r="17" fill="#001F5B"/>
      <circle cx="127" cy="118" r="7" fill="white" opacity="0.95"/>
      <circle cx="151" cy="110" r="5" fill="white" opacity="0.85"/>
    </g>
    
  <g transform="translate(330, 204)">
    <text x="0" y="0" font-family="Montserrat, Poppins, Inter, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-4">
      <tspan fill="#00B8E6">SQL</tspan><tspan fill="#001F5B" dx="26">Watcher</tspan>
    </text>
  </g>
</svg>
