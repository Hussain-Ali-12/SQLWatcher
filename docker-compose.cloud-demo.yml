services:
  sqlwatcher-proxy:
    environment:
      PROXY_TARGET_HOST: ${CLOUD_DB_HOST}
      PROXY_TARGET_PORT: ${CLOUD_DB_PORT:-5432}
      PROXY_TARGET_SSL_MODE: ${PROXY_TARGET_SSL_MODE:-require}
      PROXY_FAST_LOCAL_DETECTION: ${PROXY_FAST_LOCAL_DETECTION:-true}
      PROXY_BACKGROUND_RECORDING: ${PROXY_BACKGROUND_RECORDING:-true}
      PROXY_RECORD_SEMAPHORE: ${PROXY_RECORD_SEMAPHORE:-25}

  secureshop-api:
    environment:
      DIRECT_DATABASE_URL: ${CLOUD_DIRECT_DATABASE_URL}
      SQLWATCHER_PROXY_DATABASE_URL: ${CLOUD_PROXY_DATABASE_URL}
      DEFAULT_CONNECTION_MODE: proxy
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174

  secureshop-frontend:
    environment:
      SECURESHOP_API_BASE_URL: ${SECURESHOP_API_BASE_URL:-http://127.0.0.1:9000}
